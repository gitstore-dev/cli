[package]
name = "gitstore-image-library-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["rustls"]
rustls = ["oci-client/rustls-tls"]
native = ["oci-client/native-tls"]

[dependencies]
oci-client = { git = "https://github.com/oras-project/rust-oci-client", rev = "71c08729adeb88fbdda43966ece962d32b58fb8d", default-features = false }
ocirender = "=0.2.3"
tokio = { version = "1", features = ["rt", "time"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
tower = { version = "0.5", features = ["util"] }
http = "1"

[dev-dependencies]
tar = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

name: PR Title Lint

on:
  # Metadata only: never check out or execute pull request code in this workflow.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The PR title was already checked before entry to the merge queue.
      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            style
            perf
            ci
            build
            revert
          requireScope: false

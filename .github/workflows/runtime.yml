name: Runtime reference hosts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_native_run:
        description: 'Successful unsigned Linux build run for explicit ephemeral native smoke; no release qualification'
        required: false
        type: string
      hosted_native_full:
        description: 'Also run owned clean-install, recovery, integrity and performance suites; no release qualification'
        required: false
        default: false
        type: boolean
      fedora_native_run:
        description: 'Successful unsigned Linux producer for explicit Fedora systemd/cgroup native review; no release qualification'
        required: false
        type: string
      release_preflight:
        description: 'Check the configured release App and sign/verify an unqualified text fixture; no release or tag'
        required: false
        default: none
        type: choice
        options: [none, app, signing, all]
      review_cli_run:
        description: 'Successful unsigned CLI candidate run for disposable Homebrew review (no release qualification)'
        required: false
        type: string
      review_upgrades:
        description: 'Require next-alpha replacement fixtures from the same selected CLI/Linux producers'
        required: false
        default: false
        type: boolean
      review_fedora_only:
        description: 'Run only the explicit Fedora Homebrew review after selecting the same-source inputs'
        required: false
        default: false
        type: boolean
      review_linux_run:
        description: 'Same-source successful unsigned Linux candidate run; requires review_cli_run'
        required: false
        type: string
      native_fixture:
        description: 'Owned mode-0600 fixture manifest on dedicated reference runners; empty skips workloads'
        required: false
        type: string
      denied_fixture:
        description: 'Separate disposable fixture with actual TUN denial; empty skips denial workloads'
        required: false
        type: string
      candidate_run:
        description: 'Exact-source successful release.yml run to qualify; empty runs development checks'
        required: false
        type: string
      candidate_tag:
        description: 'Exact reviewed candidate v-tag (qualification only)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  libraries:
    if: github.event_name != 'workflow_dispatch' || (inputs.candidate_run == '' && inputs.review_cli_run == '' && inputs.hosted_native_run == '' && inputs.fedora_native_run == '' && inputs.release_preflight == 'none')
    name: Libraries ${{ matrix.arch }} / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, mode: normal}
          - {arch: arm64, runner: ubuntu-24.04-arm, mode: normal}
          - {arch: amd64, runner: ubuntu-24.04, mode: sanitized}
          - {arch: arm64, runner: ubuntu-24.04-arm, mode: sanitized}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build-time library headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake make pkg-config meson ninja-build libsystemd-dev libseccomp-dev libcap-dev libjson-c-dev libglib2.0-dev libssl-dev libcurl4-openssl-dev libcrypt-dev
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Build ordinary native code dependencies
        env:
          MODE: ${{ matrix.mode }}
        run: |
          sanitizer=OFF
          if [ "$MODE" = sanitized ]; then sanitizer=ON; fi
          CC=clang-18 cmake -S daemon -B build/reference \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGITSTORED_TESTING=ON \
            -DGITSTORED_IMAGE_SDK=ON -DGITSTORED_LIBCRUN=ON \
            -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=ON \
            -DGITSTORED_SANITIZERS="$sanitizer"
          cmake --build build/reference --parallel 2
      - name: Native library, identity and controlled behavior checks
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/reference --output-on-failure
      - name: Image SDK unit and private cache creation regression checks
        if: matrix.mode == 'normal'
        env:
          CARGO_BUILD_JOBS: 2
          LIBZ_SYS_STATIC: 1
          LZMA_API_STATIC: 1
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/reference/image-sdk
        run: |
          cargo test --release --locked --manifest-path daemon/image-backend/Cargo.toml
          cargo clippy --release --locked --manifest-path daemon/image-backend/Cargo.toml --all-targets -- -D warnings
      - name: Production package and no test facilities
        if: matrix.mode == 'normal'
        run: |
          cargo build --release --locked -p gs
          cmake -S daemon -B build/production -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DGITSTORED_TESTING=OFF -DGITSTORED_IMAGE_SDK=ON \
            -DGITSTORED_LIBCRUN=ON -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=ON
          cmake --build build/production --parallel 2
          nm build/production/gitstored > build/production/symbols.txt
          if grep -E 'gstd_test_|gstd_controlled_|gstd_failpoint' build/production/symbols.txt; then exit 1; fi
          scripts/measure-runtime-size.sh --gs "$PWD/target/release/gs" \
            --daemon "$PWD/build/production/gitstored" --output-directory "$PWD/build/measurement"
          python3 runtime/experiments/cli-provenance/test_policy.py
      - name: Private-static closure for movable packages (unqualified build check)
        if: matrix.mode == 'normal'
        run: |
          sudo apt-get install -y dpkg-dev libpcre2-dev patchelf
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          lock = json.loads(pathlib.Path('packaging/curl-source.json').read_text())
          root = pathlib.Path('build/curl-sources').resolve()
          root.mkdir()
          for name, digest in lock['files'].items():
              with urllib.request.urlopen('https://archive.ubuntu.com/ubuntu/pool/main/c/curl/' + name, timeout=60) as source:
                  payload = source.read(64 * 1024 * 1024)
              assert hashlib.sha256(payload).hexdigest() == digest
              (root / name).write_bytes(payload)
          PY
          python3 scripts/build-static-curl.py --source-cache "$PWD/build/curl-sources" \
            --build-dir "$PWD/build/curl-build" --prefix "$PWD/build/static-curl"
          LIBZ_SYS_STATIC=1 cargo build --release --workspace --locked
          cmake -S daemon -B build/distribution -DCMAKE_BUILD_TYPE=MinSizeRel -DGITSTORED_TESTING=OFF \
            -DGITSTORED_IMAGE_SDK=ON -DGITSTORED_LIBCRUN=ON -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=ON \
            -DGITSTORED_STATIC_DISTRIBUTION=ON -DGITSTORED_STATIC_CURL_PREFIX="$PWD/build/static-curl"
          cmake --build build/distribution --parallel 2
          install -d -m 700 build/closure-pair
          install -m 755 target/release/gs build/distribution/gitstored build/closure-pair/
          for binary in gs gitstored; do
            python3 runtime/packaging/closure.py --binary "$PWD/build/closure-pair/$binary" > "build/closure-pair/$binary.closure.json"
          done
          python3 -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/pip" install --require-hashes --only-binary=:all: -r packaging/requirements.txt
          GITSTORE_PACKAGE_PAIR="$PWD/build/closure-pair" "$RUNNER_TEMP/package-venv/bin/python" -m unittest discover -s tests/packaging -v
      - name: Collect actual native archive, source and full-notice review inputs
        if: matrix.mode == 'normal'
        run: |
          python3 - <<'PY'
          import os, pathlib, platform
          uri = 'https://ports.ubuntu.com/ubuntu-ports' if platform.machine() == 'aarch64' else 'https://archive.ubuntu.com/ubuntu'
          pathlib.Path(os.environ['RUNNER_TEMP'],'gitstore-source.sources').write_text(
              'Types: deb-src\nURIs: '+uri+'\nSuites: noble noble-updates noble-security\n'
              'Components: main universe\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n')
          PY
          sudo apt-get -o "Dir::Etc::sourcelist=$RUNNER_TEMP/gitstore-source.sources" \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=false \
            -o Acquire::Retries=0 -o Acquire::https::Timeout=30 update --error-on=any
          material_target=$(rustc --version --verbose | awk '/^host: / {print $2}')
          cargo metadata --locked --format-version 1 --filter-platform "$material_target" > "$RUNNER_TEMP/cli-material-metadata.json"
          cargo metadata --locked --format-version 1 --filter-platform "$material_target" \
            --manifest-path daemon/image-backend/Cargo.toml > "$RUNNER_TEMP/image-material-metadata.json"
          "$RUNNER_TEMP/package-venv/bin/python" scripts/collect-rust-materials.py \
            --metadata "$RUNNER_TEMP/cli-material-metadata.json" --lockfile Cargo.lock \
            --metadata "$RUNNER_TEMP/image-material-metadata.json" --lockfile daemon/image-backend/Cargo.lock \
            --output "$RUNNER_TEMP/rust-material-review"
          "$RUNNER_TEMP/package-venv/bin/python" scripts/prepare-relink-kit.py \
            --build-dir "$PWD/build/distribution" --output "$RUNNER_TEMP/relink-review"
          mkdir -m 700 "$RUNNER_TEMP/distro-source-cache"
          "$RUNNER_TEMP/package-venv/bin/python" scripts/collect-native-materials.py \
            --rust-review "$RUNNER_TEMP/rust-material-review" --build-dir "$PWD/build/distribution" \
            --relink-json "$RUNNER_TEMP/relink-review/relink.json" --distro-sources "$RUNNER_TEMP/distro-source-cache" \
            --apt-sources "$RUNNER_TEMP/gitstore-source.sources" --output "$RUNNER_TEMP/material-review"
      - name: Archive proposed material inputs for review, never a release
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-material-review-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/material-review/notices.json
            ${{ runner.temp }}/material-review/closure.json
            ${{ runner.temp }}/material-review/materials.json
            ${{ runner.temp }}/material-review/review.json
          if-no-files-found: error
          retention-days: 7
      - name: Build complete read-only Linux candidate from committed reviews
        if: matrix.mode == 'normal' && hashFiles('packaging/release-inputs/linux-x64/notices.json') != ''
        run: |
          sudo apt-get install -y rpm
          "$RUNNER_TEMP/package-venv/bin/python" scripts/build-release-platform.py --output "$RUNNER_TEMP/complete-candidate"
          "$RUNNER_TEMP/package-venv/bin/python" tests/packaging/check-produced.py \
            --candidate "$RUNNER_TEMP/complete-candidate" --output "$RUNNER_TEMP/produced-package-checks"
      - name: Check actual next-alpha replacement and native refusal controls
        if: matrix.mode == 'normal' && hashFiles('packaging/release-inputs/linux-x64/notices.json') != ''
        run: |
          "$RUNNER_TEMP/package-venv/bin/python" tests/packaging/check-produced-replacement.py \
            --candidate "$RUNNER_TEMP/complete-candidate" --output "$RUNNER_TEMP/replacement-checks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.mode == 'normal' && hashFiles('packaging/release-inputs/linux-x64/notices.json') != ''
        with:
          name: unqualified-replacement-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/replacement-checks/result.json
            ${{ runner.temp }}/replacement-checks/built/UNQUALIFIED.json
            ${{ runner.temp }}/replacement-checks/packages/UNQUALIFIED*
          if-no-files-found: error
          retention-days: 7
      - name: Retain complete unsigned Linux candidate for review
        if: always() && matrix.mode == 'normal' && hashFiles('packaging/release-inputs/linux-x64/notices.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-production-candidate-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/complete-candidate/assets/*
            ${{ runner.temp }}/produced-package-checks/measurement.json
          if-no-files-found: error
          retention-days: 7
      - name: Archive closure diagnostics only, not a qualified release
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-closure-${{ matrix.arch }}
          path: build/closure-pair/*.closure.json
          if-no-files-found: error
          retention-days: 7
      - name: Archive development measurement only
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-measurement-${{ matrix.arch }}
          path: build/measurement/measurement.json
          if-no-files-found: error
          retention-days: 7
  native:
    name: Dedicated native ${{ matrix.arch }}
    # Never execute PR/fork code on persistent reference hosts. Only a maintainer
    # dispatch of reviewed main may select these explicitly disposable fixtures.
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && github.ref == 'refs/heads/main' && inputs.native_fixture != ''
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, Linux, gitstore-runtime, '${{ matrix.arch }}']
    timeout-minutes: 60
    concurrency:
      group: runtime-reference-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build reviewed source for the selected disposable host
        run: |
          test "$(id -u)" != 0
          cargo build --release --locked -p gs
          cmake -S daemon -B build/reference-native -DCMAKE_BUILD_TYPE=Debug \
            -DGITSTORED_TESTING=ON -DGITSTORED_IMAGE_SDK=ON -DGITSTORED_LIBCRUN=ON \
            -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=ON
          cmake --build build/reference-native --parallel 2
          cmake -S daemon -B build/unsupported -DCMAKE_BUILD_TYPE=MinSizeRel -DGITSTORED_TESTING=OFF
          cmake --build build/unsupported --parallel 2
      - name: Bind fixture to this source's executable bytes
        env:
          FIXTURE: ${{ inputs.native_fixture }}
        run: |
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          source = Path(os.environ['FIXTURE'])
          info = source.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid()
          assert stat.S_IMODE(info.st_mode) == 0o600 and info.st_nlink == 1 and 0 < info.st_size <= 65536
          settings = json.loads(source.read_bytes())
          assert settings['dedicatedTestAccount'] is True and settings['disposableUid'] == os.geteuid()
          root = Path.cwd()
          native = root / 'build/reference-native'
          settings.update(gs=str(root / 'target/release/gs'), daemon=str(native / 'gitstored'),
              unsupportedDaemon=str(root / 'build/unsupported/gitstored'),
              migrationProbe=str(native / 'migration_probe'), datastoreProbe=str(native / 'deployment_probe'),
              scyllaNativeProbe=str(native / 'scylla_native_probe'), scyllaBackupProbe=str(native / 'scylla_backup_probe'),
              volumeDiskProbe=str(native / 'disk_probe'), sourceRevision=os.environ['GITHUB_SHA'])
          destination = root / 'build' / ('qualified-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.json')
          fd = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as output:
              json.dump(settings, output)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('QUALIFIED_FIXTURE=' + str(destination) + '\n')
          PY
      - name: Owned host, dependency, offline and lifecycle acceptance
        env:
          FIXTURE: ${{ env.QUALIFIED_FIXTURE }}
        run: |
          test "$(id -u)" != 0
          scripts/test-runtime.sh --scenario core-offline --fixture "$FIXTURE"
          scripts/test-runtime.sh --scenario clean-install --fixture "$FIXTURE"
          scripts/test-runtime.sh --scenario recovery --fixture "$FIXTURE"
          scripts/test-runtime.sh --scenario persistent-scylla --fixture "$FIXTURE"
          scripts/test-runtime.sh --scenario optional --fixture "$FIXTURE"
  denial:
    name: Dedicated TUN denial ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && github.ref == 'refs/heads/main' && inputs.denied_fixture != ''
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, Linux, gitstore-runtime-denied, '${{ matrix.arch }}']
    timeout-minutes: 45
    concurrency:
      group: runtime-denied-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the reviewed source on the denial host
        run: |
          test "$(id -u)" != 0
          cargo build --release --locked -p gs
          cmake -S daemon -B build/denied-native -DCMAKE_BUILD_TYPE=Debug \
            -DGITSTORED_TESTING=ON -DGITSTORED_IMAGE_SDK=ON -DGITSTORED_LIBCRUN=ON \
            -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=ON
          cmake --build build/denied-native --parallel 2
      - name: Qualify the explicitly denied fixture
        env:
          FIXTURE: ${{ inputs.denied_fixture }}
        run: |
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          source = Path(os.environ['FIXTURE'])
          info = source.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid()
          assert stat.S_IMODE(info.st_mode) == 0o600 and info.st_nlink == 1 and 0 < info.st_size <= 65536
          settings = json.loads(source.read_bytes())
          assert settings['dedicatedTestAccount'] is True and settings['disposableUid'] == os.geteuid()
          root = Path.cwd()
          settings.update(gs=str(root / 'target/release/gs'), daemon=str(root / 'build/denied-native/gitstored'), sourceRevision=os.environ['GITHUB_SHA'])
          destination = root / 'build' / ('denied-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.json')
          fd = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as output:
              json.dump(settings, output)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('QUALIFIED_DENIED_FIXTURE=' + str(destination) + '\n')
          PY
      - name: Observe actual TUN denial before provisioning
        env:
          FIXTURE: ${{ env.QUALIFIED_DENIED_FIXTURE }}
          GITSTORE_EXPECT_MISSING_TUN: '1'
        run: scripts/test-runtime.sh --scenario host-unmet --fixture "$FIXTURE"
  qualification-input:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/{0}', inputs.candidate_tag)) && inputs.candidate_run != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require reviewed same-source candidate before using reference hosts
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python3 scripts/check-release-run.py --run-id "$CANDIDATE_RUN" --workflow release.yml --revision "$GITHUB_SHA" --tag "$CANDIDATE_TAG"
  qualification:
    needs: qualification-input
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: 'ubuntu:24.04', label: ubuntu24, arch: x64, runner: ubuntu-24.04}
          - {host: 'ubuntu:24.04', label: ubuntu24, arch: arm64, runner: ubuntu-24.04-arm}
          - {host: 'fedora:44', label: fedora44, arch: x64, runner: ubuntu-24.04}
          - {host: 'fedora:44', label: fedora44, arch: arm64, runner: ubuntu-24.04-arm}
          - {host: macos-15, label: macos15, arch: arm64, runner: macos-15}
          - {host: macos-15-intel, label: macos15, arch: x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    concurrency:
      group: release-reference-${{ matrix.label }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare fixture tooling only on the selected ephemeral Linux host
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv uidmap dbus-user-session sudo git gcc make file curl tar gzip bzip2 patch procps patchelf nodejs npm
      - name: Prepare pinned schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/qualification-venv"
          "$RUNNER_TEMP/qualification-venv/bin/pip" install --require-hashes --only-binary=:all: -r packaging/requirements.txt
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: unqualified-replacement-*
          path: ${{ runner.temp }}/qualification-controls
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: qualification-controls-*
          path: ${{ runner.temp }}/qualification-controls
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Execute exact-byte package and native acceptance on isolated hosted fixtures
        env:
          HOST: ${{ matrix.host }}
          TAG: ${{ inputs.candidate_tag }}
        run: |
          "$RUNNER_TEMP/qualification-venv/bin/python" tests/packaging/run-hosted-qualification.py \
            --candidate "$RUNNER_TEMP/release-candidate" --controls "$RUNNER_TEMP/qualification-controls" \
            --host "$HOST" --tag "$TAG" --output "$RUNNER_TEMP/qualification-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-${{ matrix.label }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/qualification-output/receipts/*.json
          if-no-files-found: error
  qualification-complete:
    needs: qualification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: qualification-*
          path: receipts
          merge-multiple: true
      - name: Validate the complete selected host/channel set before emitting evidence
        run: |
          python3 -m venv "$RUNNER_TEMP/qualification-venv"
          "$RUNNER_TEMP/qualification-venv/bin/pip" install --require-hashes --only-binary=:all: -r packaging/requirements.txt
          "$RUNNER_TEMP/qualification-venv/bin/python" - <<'PY'
          import json, pathlib, shutil, sys
          sys.path.insert(0,'runtime/packaging')
          from release_candidate import validate_receipts
          root = pathlib.Path('candidate').resolve()
          value = json.loads((root/'candidate.json').read_text())
          value['receipts'] = []
          for path in pathlib.Path('receipts').glob('*.json'):
              assert not (root/path.name).exists()
              shutil.copyfile(path,root/path.name)
              value['receipts'].append(path.name)
          validate_receipts(value,root)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-qualification
          path: receipts/*.json
          if-no-files-found: error

  package-review-inputs:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && inputs.review_cli_run != '' && inputs.review_linux_run != '' && inputs.candidate_run == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

  hosted-native-review:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && inputs.hosted_native_run != '' && inputs.candidate_run == '' && inputs.review_cli_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, label: amd64, runner: ubuntu-24.04}
          - {arch: arm64, label: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.hosted_native_full && 60 || 15 }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate selected unsigned Linux source run
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN: ${{ inputs.hosted_native_run }}
        run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install --require-hashes --only-binary=:all: -r packaging/requirements.txt
          "$RUNNER_TEMP/review-venv/bin/python" - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('review','scripts/prepare-package-review.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          module.selected_run(int(os.environ['SELECTED_RUN']),'runtime.yml')
          PY
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unpublished-production-candidate-linux-${{ matrix.label }}
          path: ${{ runner.temp }}/native-candidate
          run-id: ${{ inputs.hosted_native_run }}
          github-token: ${{ github.token }}
      - name: Validate exact pair and prepare owned ephemeral host
        id: owned-host
        env:
          ARCH: ${{ matrix.arch }}
          GITSTORE_DISPOSABLE_FIXTURE: github-hosted-ubuntu24
        run: |
          "$RUNNER_TEMP/review-venv/bin/python" - <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          sys.path.insert(0,'runtime/packaging')
          from inventory import validate_install
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-candidate/complete-candidate/assets'
          choices = list(root.glob('*.install.json')); assert len(choices) == 1
          inventory = json.loads(choices[0].read_text()); validate_install(inventory)
          assert (inventory['os'],inventory['arch']) == ('linux',os.environ['ARCH'])
          pair = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-pair'; pair.mkdir(mode=0o700)
          (pair/'install-inventory.json').write_text(json.dumps(inventory))
          for name in ('gs','gitstored'):
              path = root/(name+'-'+inventory['applicationVersion']+'-linux-'+inventory['arch'])
              assert hashlib.sha256(path.read_bytes()).hexdigest() == inventory['executables'][name]['sha256']
              shutil.copyfile(path,pair/name); (pair/name).chmod(0o755)
          PY
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY_ID,GITHUB_RUN_ID,GITHUB_SHA,GITSTORE_DISPOSABLE_FIXTURE \
            sh tests/packaging/prepare-hosted-linux-fixture.sh "$RUNNER_TEMP/native-pair" "$PWD"
      - name: Real owned core lifecycle, never a passing skip
        id: core-smoke
        run: |
          sudo -u gitstorefixture python3 /home/gitstorefixture/source/tests/packaging/check-linux-fixture.py \
            --fixture /home/gitstorefixture/experiments/hosted.json
          sudo -u gitstorefixture python3 /home/gitstorefixture/source/tests/runtime/run.py --scenario core-memdb \
            --case test_authorized_cold_start_requires_current_generation_health \
            --fixture /home/gitstorefixture/experiments/hosted.json
      - name: Prepare explicit helpers for complete owned native acceptance
        if: inputs.hosted_native_full && success()
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y cmake make pkg-config libssl-dev zlib1g-dev
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          export RUSTUP_HOME="$RUNNER_TEMP/diagnostic-rustup" RUSTUP_TOOLCHAIN="$toolchain"
          printf 'RUSTUP_HOME=%s\nRUSTUP_TOOLCHAIN=%s\n' "$RUSTUP_HOME" "$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP" && rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --no-self-update)
          CARGO_BUILD_JOBS=2 CARGO_TARGET_DIR="$RUNNER_TEMP/full-native-helpers" \
            cargo build --release --locked -p gs --example runtime_repository_probe
          cmake -S daemon -B "$RUNNER_TEMP/control-negative" -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DGITSTORED_TESTING=OFF -DGITSTORED_IMAGE_SDK=OFF -DGITSTORED_LIBCRUN=OFF \
            -DGITSTORED_SLIRP=OFF -DGITSTORED_BOOTSTRAP=OFF
          cmake --build "$RUNNER_TEMP/control-negative" --parallel 2 --target gitstored
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/control-negative/gitstored" \
            /home/gitstorefixture/experiments/unsupported-gitstored
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/full-native-helpers/release/examples/runtime_repository_probe" \
            /home/gitstorefixture/experiments/repository-probe
      - name: Complete owned clean-install recovery integrity and cost checks
        if: inputs.hosted_native_full && success()
        run: |
          sudo -u gitstorefixture python3 /home/gitstorefixture/source/tests/packaging/hosted-native-acceptance.py \
            --fixture /home/gitstorefixture/experiments/hosted.json \
            --inventory /home/gitstorefixture/experiments/install-inventory.json \
            --unsupported-daemon /home/gitstorefixture/experiments/unsupported-gitstored \
            --repository-probe /home/gitstorefixture/experiments/repository-probe \
            --output /home/gitstorefixture/experiments/native-acceptance.json
      - name: Diagnose bounded TLS initialization without network or credentials
        if: failure() && steps.owned-host.outcome == 'success' && steps.core-smoke.outcome == 'failure'
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          export RUSTUP_HOME="$RUNNER_TEMP/diagnostic-rustup" RUSTUP_TOOLCHAIN="$toolchain"
          printf 'RUSTUP_HOME=%s\nRUSTUP_TOOLCHAIN=%s\n' "$RUSTUP_HOME" "$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP" && rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --no-self-update)
          sudo apt-get update --error-on=any
          sudo apt-get install -y libssl-dev zlib1g-dev pkg-config
          OPENSSL_STATIC=1 LIBZ_SYS_STATIC=1 LZMA_API_STATIC=1 CARGO_BUILD_JOBS=2 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/tls-diagnostic-target" cargo build --release --locked \
            --manifest-path daemon/image-backend/Cargo.toml --example runtime_tls_probe
          sudo install -o 11000 -g 11000 -m 500 \
            "$RUNNER_TEMP/tls-diagnostic-target/release/examples/runtime_tls_probe" /home/gitstorefixture/experiments/native-tls-probe
          sudo -u gitstorefixture env -i PATH=/nonexistent HOME=/home/gitstorefixture/experiments LANG=C \
            /home/gitstorefixture/experiments/native-tls-probe --fixture /home/gitstorefixture/experiments/hosted.json
      - name: Diagnose libcrun with a synthetic credential-free payload
        if: failure() && steps.owned-host.outcome == 'success' && steps.core-smoke.outcome == 'failure'
        run: |
          sudo apt-get install -y cmake make meson ninja-build pkg-config libsystemd-dev libseccomp-dev libcap-dev libjson-c-dev libglib2.0-dev
          cmake -S daemon -B "$RUNNER_TEMP/libcrun-diagnostic" -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DGITSTORED_TESTING=ON -DGITSTORED_LIBCRUN=ON -DGITSTORED_IMAGE_SDK=OFF \
            -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=OFF
          cmake --build "$RUNNER_TEMP/libcrun-diagnostic" --parallel 2 \
            --target native_library_probe native_library_payload native_adapter_probe native_registered_payload
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/libcrun-diagnostic/native_library_probe" \
            "$RUNNER_TEMP/libcrun-diagnostic/native_library_payload" \
            "$RUNNER_TEMP/libcrun-diagnostic/native_adapter_probe" \
            "$RUNNER_TEMP/libcrun-diagnostic/native_registered_payload" /home/gitstorefixture/experiments/
          sudo install -o 11000 -g 11000 -m 400 runtime/experiments/libcrun/run.py /home/gitstorefixture/experiments/libcrun-probe.py
          sudo -u gitstorefixture python3 /home/gitstorefixture/experiments/libcrun-probe.py \
            /home/gitstorefixture/experiments/native_library_probe /home/gitstorefixture/experiments/native_library_payload \
            --delegated --keep --fixture-parent /home/gitstorefixture/experiments
          sudo -u gitstorefixture python3 /home/gitstorefixture/experiments/libcrun-probe.py \
            /home/gitstorefixture/experiments/native_adapter_probe /home/gitstorefixture/experiments/native_registered_payload \
            --delegated --registered --network --seccomp "/home/gitstorefixture/source/runtime/profiles/seccomp/${{ matrix.label }}.json" \
            --keep --fixture-parent /home/gitstorefixture/experiments
      - name: Diagnose confined reads of synthetic owned mode-zero files
        if: failure() && steps.owned-host.outcome == 'success' && steps.core-smoke.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('apparmor_restrict_unprivileged_userns','apparmor_restrict_unprivileged_unconfined'):
              path=Path('/proc/sys/kernel')/name
              print(name+': '+(path.read_text().strip() if path.is_file() else 'unavailable'))
          PY
          cmake --build "$RUNNER_TEMP/libcrun-diagnostic" --parallel 2 --target test_owned_read
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/libcrun-diagnostic/test_owned_read" \
            /home/gitstorefixture/experiments/test-owned-read
          sudo -u gitstorefixture env -i PATH=/nonexistent HOME=/home/gitstorefixture/experiments LANG=C \
            /home/gitstorefixture/experiments/test-owned-read
      - name: Diagnose offline materialization from the owned failed cache
        if: failure() && steps.owned-host.outcome == 'success' && steps.core-smoke.outcome == 'failure'
        run: |
          OPENSSL_STATIC=1 LIBZ_SYS_STATIC=1 LZMA_API_STATIC=1 CARGO_BUILD_JOBS=2 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/tls-diagnostic-target" cargo build --release --locked \
            --manifest-path daemon/image-backend/Cargo.toml --features developer-diagnostics --lib
          cmake -S daemon -B "$RUNNER_TEMP/libcrun-diagnostic" -DGITSTORED_IMAGE_SDK=ON
          mkdir -p "$RUNNER_TEMP/libcrun-diagnostic/image-sdk/release"
          cp "$RUNNER_TEMP/tls-diagnostic-target/release/libgitstored_image.a" \
            "$RUNNER_TEMP/libcrun-diagnostic/image-sdk/release/libgitstored_image.a"
          cmake --build "$RUNNER_TEMP/libcrun-diagnostic" --parallel 2 --target provision_probe
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/libcrun-diagnostic/provision_probe" \
            /home/gitstorefixture/experiments/provision-probe
          sudo install -o 11000 -g 11000 -m 400 tests/packaging/diagnose-native.py \
            /home/gitstorefixture/experiments/image-diagnostic.py
          sudo -u gitstorefixture python3 /home/gitstorefixture/experiments/image-diagnostic.py \
            --fixture /home/gitstorefixture/experiments/hosted.json \
            --provision-probe /home/gitstorefixture/experiments/provision-probe \
            --output /home/gitstorefixture/experiments/materialization-diagnostic.json
      - name: Verify fresh pinned image acquisition and reconstruction
        if: failure() && steps.owned-host.outcome == 'success' && steps.core-smoke.outcome == 'failure'
        run: |
          sudo -u gitstorefixture env -i PATH=/usr/bin:/bin HOME=/home/gitstorefixture/experiments LANG=C python3 - <<'PY'
          import json, os, pathlib, stat, subprocess, tempfile
          parent=pathlib.Path('/home/gitstorefixture/experiments')
          assert os.geteuid()==11000 and parent.stat().st_uid==11000 and stat.S_IMODE(parent.stat().st_mode)==0o700
          cache=pathlib.Path(tempfile.mkdtemp(prefix='fresh-pinned-image-',dir=parent))
          probe=parent/'provision-probe'
          # Explicit fixture-only consent to download the probe's compiled,
          # immutable public Git image. No workload command is executed.
          for mode in ('download','materialize','materialize-sdk'):
              target=cache if mode=='download' else pathlib.Path(tempfile.mkdtemp(prefix='fresh-pinned-work-',dir=parent))
              command=[str(probe),'git',str(target),'180000']
              if mode!='download': command += [str(cache),mode]
              result=subprocess.run(command,env=dict(PATH='/nonexistent',HOME=str(target),LANG='C'),capture_output=True,text=True,timeout=190)
              value=json.loads(result.stdout)
              print(json.dumps(dict(mode=mode,exit=result.returncode,status=value['status'],root=target.name)),flush=True)
              assert result.returncode==0 and value['status']==0
          layers=list((cache/'blobs').iterdir()); assert 0<len(layers)<=128
          assert all(stat.S_ISREG(p.lstat().st_mode) and stat.S_IMODE(p.lstat().st_mode)==0o600 for p in layers)
          PY
      - name: Check current production source after a selected candidate failure
        if: inputs.hosted_native_full && failure() && steps.owned-host.outcome == 'success' && steps.core-smoke.outcome == 'failure'
        run: |
          sudo apt-get install -y libcurl4-openssl-dev libcrypt-dev
          OPENSSL_STATIC=1 LIBZ_SYS_STATIC=1 LZMA_API_STATIC=1 CARGO_BUILD_JOBS=2 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/tls-diagnostic-target" cargo build --release --locked \
            --manifest-path daemon/image-backend/Cargo.toml --lib
          cmake -S daemon -B "$RUNNER_TEMP/source-production" -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DGITSTORED_TESTING=OFF -DGITSTORED_IMAGE_SDK=ON -DGITSTORED_LIBCRUN=ON \
            -DGITSTORED_SLIRP=ON -DGITSTORED_BOOTSTRAP=ON
          mkdir -p "$RUNNER_TEMP/source-production/image-sdk/release"
          cp "$RUNNER_TEMP/tls-diagnostic-target/release/libgitstored_image.a" \
            "$RUNNER_TEMP/source-production/image-sdk/release/libgitstored_image.a"
          cmake --build "$RUNNER_TEMP/source-production" --parallel 2 --target gitstored
          nm "$RUNNER_TEMP/source-production/gitstored" > "$RUNNER_TEMP/source-production/symbols.txt"
          if grep -E 'gstd_test_|gstd_controlled_|gstd_failpoint' "$RUNNER_TEMP/source-production/symbols.txt"; then exit 1; fi
          sudo install -d -o 11000 -g 11000 -m 700 /home/gitstorefixture/experiments/source-production-pair \
            /home/gitstorefixture/experiments/src
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/source-production/gitstored" \
            /home/gitstorefixture/experiments/source-production-pair/gitstored
          sudo install -o 11000 -g 11000 -m 500 "$RUNNER_TEMP/native-pair/gs" \
            /home/gitstorefixture/experiments/source-production-pair/gs
          sudo -u gitstorefixture python3 - <<'PY'
          import json, os, pathlib
          parent=pathlib.Path('/home/gitstorefixture/experiments')
          value=json.loads((parent/'hosted.json').read_text())
          value.update(gs=str(parent/'source-production-pair/gs'),daemon=str(parent/'source-production-pair/gitstored'),
              fixtureParent=str(parent/'src'),
              purpose='Current production-source daemon with selected candidate gs; not an exact candidate or release qualification')
          fd=os.open(parent/'source-production-fixture.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as output: json.dump(value,output)
          PY
          sudo -u gitstorefixture python3 /home/gitstorefixture/source/tests/runtime/run.py --scenario core-memdb \
            --case test_authorized_cold_start_requires_current_generation_health \
            --fixture /home/gitstorefixture/experiments/source-production-fixture.json
      - name: Retain only bounded safe native diagnostic metadata
        if: always()
        run: |
          sudo -u gitstorefixture python3 /home/gitstorefixture/source/tests/packaging/diagnose-native.py \
            --fixture /home/gitstorefixture/experiments/hosted.json --output /home/gitstorefixture/experiments/diagnostic.json
          sudo install -m 644 /home/gitstorefixture/experiments/diagnostic.json "$RUNNER_TEMP/native-diagnostic.json"
          if sudo test -f /home/gitstorefixture/experiments/native-acceptance.json; then
            sudo install -m 644 /home/gitstorefixture/experiments/native-acceptance.json "$RUNNER_TEMP/native-acceptance.json"
          fi
          sudo -u gitstorefixture python3 - <<'PY'
          import json, os, pathlib
          parent=pathlib.Path('/home/gitstorefixture/experiments')
          records=list((parent/'src').glob('runtime-run-core-memdb-*.json'))
          if len(records)==1:
              value=json.loads(records[0].read_text())
              safe={key:value[key] for key in ('status','scenario','case','elapsedSeconds','executables')}
              safe['scope']='Current production-source diagnostic, not selected candidate or release qualification'
              fd=os.open(parent/'source-core.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'w') as output: json.dump(safe,output,indent=2)
          PY
          if sudo test -f /home/gitstorefixture/experiments/source-core.json; then
            sudo install -m 644 /home/gitstorefixture/experiments/source-core.json "$RUNNER_TEMP/source-core.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unsigned-native-review-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native-diagnostic.json
            ${{ runner.temp }}/native-acceptance.json
            ${{ runner.temp }}/source-core.json
          if-no-files-found: warn
          retention-days: 7

  hosted-fedora-review:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && inputs.fedora_native_run != ''
    name: Fedora native review ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, label: amd64, runner: ubuntu-24.04}
          - {arch: arm64, label: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate explicit unsigned Fedora source selection
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN: ${{ inputs.fedora_native_run }}
          OTHER_SELECTION: ${{ inputs.release_preflight != 'none' && 'release-preflight' || inputs.hosted_native_run || inputs.review_cli_run || inputs.review_linux_run || (inputs.review_upgrades && 'review-upgrades') || inputs.candidate_run || inputs.candidate_tag || inputs.native_fixture || inputs.denied_fixture }}
        run: |
          test -z "$OTHER_SELECTION"
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install --require-hashes --only-binary=:all: -r packaging/requirements.txt
          "$RUNNER_TEMP/review-venv/bin/python" - <<'PY'
          import importlib.util, os
          spec=importlib.util.spec_from_file_location('review','scripts/prepare-package-review.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          module.selected_run(int(os.environ['SELECTED_RUN']),'runtime.yml')
          PY
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unpublished-production-candidate-linux-${{ matrix.label }}
          path: ${{ runner.temp }}/native-candidate
          run-id: ${{ inputs.fedora_native_run }}
          github-token: ${{ github.token }}
      - name: Build separate source-pinned developer helpers
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y cmake make pkg-config libssl-dev zlib1g-dev
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          export RUSTUP_HOME="$RUNNER_TEMP/fedora-rustup" RUSTUP_TOOLCHAIN="$toolchain"
          printf 'RUSTUP_HOME=%s\nRUSTUP_TOOLCHAIN=%s\n' "$RUSTUP_HOME" "$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP" && rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --no-self-update)
          CARGO_BUILD_JOBS=2 CARGO_TARGET_DIR="$RUNNER_TEMP/fedora-helpers" cargo build --release --locked -p gs --example runtime_repository_probe
          cmake -S daemon -B "$RUNNER_TEMP/fedora-control-negative" -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DGITSTORED_TESTING=OFF -DGITSTORED_IMAGE_SDK=OFF -DGITSTORED_LIBCRUN=OFF \
            -DGITSTORED_SLIRP=OFF -DGITSTORED_BOOTSTRAP=OFF
          cmake --build "$RUNNER_TEMP/fedora-control-negative" --parallel 2 --target gitstored
          mkdir -m 700 "$RUNNER_TEMP/fedora-selected-helpers"
          install -m 500 "$RUNNER_TEMP/fedora-control-negative/gitstored" "$RUNNER_TEMP/fedora-selected-helpers/unsupported-daemon"
          install -m 500 "$RUNNER_TEMP/fedora-helpers/release/examples/runtime_repository_probe" "$RUNNER_TEMP/fedora-selected-helpers/repository-probe"
      - name: Run owned Fedora package and native acceptance
        env:
          SELECTED_RUN: ${{ inputs.fedora_native_run }}
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          "$RUNNER_TEMP/review-venv/bin/python" tests/packaging/run-hosted-fedora.py \
            --producer-run "$SELECTED_RUN" \
            --candidate "$RUNNER_TEMP/native-candidate/complete-candidate/assets" \
            --unsupported-daemon "$RUNNER_TEMP/fedora-selected-helpers/unsupported-daemon" \
            --repository-probe "$RUNNER_TEMP/fedora-selected-helpers/repository-probe" \
            --output "$RUNNER_TEMP/fedora-review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unsigned-fedora-native-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/fedora-review/native-acceptance.json
            ${{ runner.temp }}/fedora-review/package-controls.json
          if-no-files-found: warn
          retention-days: 7

  release-app-preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && (inputs.release_preflight == 'app' || inputs.release_preflight == 'all') && startsWith(github.ref, 'refs/heads/')
    name: Release App preflight (read API only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require a separate explicit preflight selection
        env:
          OTHER_SELECTION: ${{ inputs.hosted_native_full && 'native-full' || inputs.hosted_native_run || inputs.fedora_native_run || inputs.review_cli_run || inputs.review_linux_run || (inputs.review_upgrades && 'review-upgrades') || inputs.candidate_run || inputs.candidate_tag || inputs.native_fixture || inputs.denied_fixture }}
        run: test -z "$OTHER_SELECTION"
      - name: Mint the existing App token scoped only to this repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: gitstore-dev
          repositories: cli
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Check installation access without changing repository content
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api installation/repositories --jq '{totalCount:.total_count,repositoryIds:[.repositories[].id]}' > "$RUNNER_TEMP/release-app-preflight.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-app-preflight.json'
          value=json.loads(p.read_text())
          assert value==dict(totalCount=1,repositoryIds=[1431005655])
          value.update(status='passed',requestedPermissions=['contents:write','issues:write','pull_requests:write'],scope='App creation and read-only access test; no PR/tag/release mutation')
          p.write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-app-preflight
          path: ${{ runner.temp }}/release-app-preflight.json
          if-no-files-found: error
          retention-days: 7

  signing-preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1431005655' && (inputs.release_preflight == 'signing' || inputs.release_preflight == 'all') && startsWith(github.ref, 'refs/heads/')
    name: Own signing fixture preflight (not a release)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Require a separate explicit preflight selection
        env:
          OTHER_SELECTION: ${{ inputs.hosted_native_full && 'native-full' || inputs.hosted_native_run || inputs.fedora_native_run || inputs.review_cli_run || inputs.review_linux_run || (inputs.review_upgrades && 'review-upgrades') || inputs.candidate_run || inputs.candidate_tag || inputs.native_fixture || inputs.denied_fixture }}
        run: test -z "$OTHER_SELECTION"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Generate only a marked non-installable test subject
        run: |
          mkdir -m 700 "$RUNNER_TEMP/signing-preflight"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'signing-preflight/release-preflight.txt'
          p.write_text('UNQUALIFIED_RELEASE_PREFLIGHT\nNot an installable release artifact.\nSource: '+os.environ['GITHUB_SHA']+'\n')
          PY
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4, same reviewed signer as release.yml
        with:
          subject-path: ${{ runner.temp }}/signing-preflight/release-preflight.txt
          push-to-registry: false
          create-storage-record: false
      - name: Verify own signature and negative controls without publishing a release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/signing-preflight/bundle.jsonl"
          gh attestation trusted-root > "$RUNNER_TEMP/signing-preflight/trusted-root.jsonl"
          python3 tests/packaging/verify-signing-preflight.py \
            --artifact "$RUNNER_TEMP/signing-preflight/release-preflight.txt" \
            --bundle "$RUNNER_TEMP/signing-preflight/bundle.jsonl" \
            --trusted-root "$RUNNER_TEMP/signing-preflight/trusted-root.jsonl" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/signing-preflight/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: own-signing-preflight-not-a-release
          path: |
            ${{ runner.temp }}/signing-preflight/release-preflight.txt
            ${{ runner.temp }}/signing-preflight/bundle.jsonl
            ${{ runner.temp }}/signing-preflight/trusted-root.jsonl
            ${{ runner.temp }}/signing-preflight/result.json
          if-no-files-found: warn
          retention-days: 7

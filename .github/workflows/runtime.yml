          include-hidden-files: true
          path: |
            ${{ runner.temp }}/package-review/review.json
            ${{ runner.temp }}/package-review/gitstore.rb
            /Users/runner/.gitstore-package-review-${{ github.run_id }}/brew-lifecycle-*/receipt.json
            /Users/runner/.gitstore-package-review-${{ github.run_id }}/brew-lifecycle-*/logs/*.log
            /home/runner/.gitstore-package-review-${{ github.run_id }}/brew-lifecycle-*/receipt.json
            /home/runner/.gitstore-package-review-${{ github.run_id }}/brew-lifecycle-*/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  apt-package-review:

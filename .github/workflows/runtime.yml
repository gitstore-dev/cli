        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RUN: ${{ inputs.review_cli_run }}
          LINUX_RUN: ${{ inputs.review_linux_run }}
          UPGRADES: ${{ inputs.review_upgrades }}
        run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install --require-hashes --only-binary=:all: -r packaging/requirements.txt
          "$RUNNER_TEMP/review-venv/bin/python" - <<'PY'
          import os, re, subprocess, sys
          command = [sys.executable,'scripts/prepare-package-review.py',

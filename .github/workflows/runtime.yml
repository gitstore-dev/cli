        with:
          name: unsigned-package-review
          path: ${{ runner.temp }}/package-review
      - name: Install/remove exact complete Homebrew candidate in private prefix
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_OS: ${{ matrix.os }}
        run: |
          review_parent="$HOME/.gitstore-package-review-$GITHUB_RUN_ID"
          mkdir -m 700 "$review_parent"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          git init "$review_parent/brew-source"
          git -C "$review_parent/brew-source" remote add origin https://github.com/Homebrew/brew.git
          git -C "$review_parent/brew-source" fetch --depth 1 origin bf464f57275cae0be106b43d190c98564ac59b0e
          git -C "$review_parent/brew-source" checkout --detach FETCH_HEAD
          python3 -m venv "$RUNNER_TEMP/review-venv"

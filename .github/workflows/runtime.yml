            ${{ runner.temp }}/package-review/gitstore-next.rb
            ${{ runner.temp }}/package-review/replacements/*/packages/UNQUALIFIED*
            ${{ runner.temp }}/package-review/*/complete-candidate/assets/gitstore-0.*.tar.gz
            ${{ runner.temp }}/package-review/linux-*/complete-candidate/assets/*.deb
            ${{ runner.temp }}/package-review/linux-*/complete-candidate/assets/*.tgz

              '--output',os.environ['RUNNER_TEMP']+'/package-review']
          if os.environ['UPGRADES']=='true':
              command += ['--replacement-cli-run',os.environ['CLI_RUN'],
                  '--replacement-linux-run',os.environ['LINUX_RUN']]
          subprocess.run(command,check=True)

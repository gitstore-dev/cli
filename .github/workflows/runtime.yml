  homebrew-review:
    if: inputs.review_fedora_only != true
    needs: package-review-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: x64}
          - {runner: ubuntu-24.04, os: linux, arch: x64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

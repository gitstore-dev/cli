name: CI Integration

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/test_live.py'
      - 'scripts/test-integration.sh'
      - 'scripts/test_integration.py'
      - 'tests/integration/**'
      - '.github/workflows/ci-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/test_live.py'
      - 'scripts/test-integration.sh'
      - 'scripts/test_integration.py'
      - 'tests/integration/**'
      - '.github/workflows/ci-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: CLI against GitStore latest (memdb)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup show
      - name: Build CLI and image integration test
        run: |
          cargo build --locked -p gs
          cargo test --locked -p gs --test images --no-run
      - name: Pull, bootstrap and test published images
        run: scripts/test-integration.sh

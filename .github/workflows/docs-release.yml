name: Update release documentation
on:
  repository_dispatch:
    types: [release-docs-published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published tag to validate; blank selects newest published release, including prereleases'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: docs-release-update
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'gitstore-dev/cli' && github.ref == 'refs/heads/main' && vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create repository-scoped documentation App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: gitstore-dev
          repositories: cli
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.16.0
      - name: Preserve trusted main policy and audit baseline
        run: |
          install -d "$RUNNER_TEMP/docs-policy"
          cp site/scripts/*.mjs "$RUNNER_TEMP/docs-policy/"
          cp site/release.json "$RUNNER_TEMP/baseline-release.json"
          cp site/content-audit.json "$RUNNER_TEMP/baseline-audit.json"
      - name: Prepare validated release documentation with trusted policy
        id: proposal
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOCS_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          git config user.name 'gitstore-release-bot'
          git config user.email 'gitstore-release-bot@users.noreply.github.com'
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head codex/docs-release-update --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin codex/docs-release-update > /dev/null 2>&1; then
            git fetch origin refs/heads/codex/docs-release-update:refs/remotes/origin/codex/docs-release-update
            git -c core.hooksPath=/dev/null checkout -b codex/docs-release-update refs/remotes/origin/codex/docs-release-update
            # Preserve reviewer commits. Conflicts need human resolution; never
            # reset or force-push a proposal that may already be under review.
            git -c core.hooksPath=/dev/null merge --no-edit origin/main
          else
            git -c core.hooksPath=/dev/null checkout -b codex/docs-release-update origin/main
          fi
          args=(--repo-root "$GITHUB_WORKSPACE" --baseline-release "$RUNNER_TEMP/baseline-release.json" --baseline-audit "$RUNNER_TEMP/baseline-audit.json")
          if [ -n "$DOCS_TAG" ]; then
            args+=(--tag "$DOCS_TAG")
          fi
          # Execute only the scripts preserved from trusted main, never modules
          # from the pending proposal. They read/write its data and guides.
          node "$RUNNER_TEMP/docs-policy/prepare-release-docs.mjs" "${args[@]}" > "$RUNNER_TEMP/docs-proposal.json"
          PR="$pr" node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          const allowed = [
            'README.md', 'docs/README.md', 'docs/installation.md', 'docs/configuration.md',
            'docs/remote-cli.md', 'docs/watch.md', 'docs/local-runtime.md',
            'docs/local-runtime-configuration.md', 'site/release.json',
            'site/reference/gs.md', 'site/content-audit.json', 'site/release-evidence.json',
          ];
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'docs-proposal.json'), 'utf8'));
          if (typeof result.changed !== 'boolean' || typeof result.reviewRequired !== 'boolean' ||
              !/^v\d+\.\d+\.\d+(?:-[\da-zA-Z]+(?:[.-][\da-zA-Z]+)*)?$/.test(result.tag) ||
              result.tag.trim() !== result.tag || !Array.isArray(result.files) ||
              result.files.some(path => !allowed.includes(path)) ||
              new Set(result.files).size !== result.files.length || (result.changed && !result.files.length)) {
            throw new Error('Invalid trusted release-docs result');
          }
          // Recover a missing PR after an interrupted push/create sequence, but
          // leave an existing proposal unchanged for duplicate or stale events.
          let differsFromMain = false;
          try {
            execFileSync('git', ['diff', '--quiet', 'origin/main', 'HEAD', '--', ...allowed]);
          } catch (error) {
            if (error.status !== 1) throw error;
            differsFromMain = true;
          }
          const needed = result.reason !== 'stale' && (result.changed || (!process.env.PR && differsFromMain));
          appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\ntag=${result.tag}\nreview-required=${result.reviewRequired}\n`);
          console.log(JSON.stringify(result));
          JS
      - name: Open or update one reviewed proposal
        if: steps.proposal.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.proposal.outputs.pr }}
          SELECTED_TAG: ${{ steps.proposal.outputs.tag }}
          REVIEW_REQUIRED: ${{ steps.proposal.outputs.review-required }}
        run: |
          mapfile -t files < <(node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/docs-proposal.json","utf8")); for(const path of result.files) console.log(path);')
          if [ "${#files[@]}" -gt 0 ]; then
            git add -- "${files[@]}"
          fi
          version="${SELECTED_TAG#v}"
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "docs: update website for $version"
          fi
          # A simultaneous reviewer push rejects this fast-forward push and is
          # retained. Rerunning safely starts from that updated proposal.
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/codex/docs-release-update
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const review = process.env.REVIEW_REQUIRED === 'true'
            ? 'Capability evidence changed outside the trusted audit. Review site/release-evidence.json and the proposed guides and audit. Docs release eligibility waits for a human maintainer to approve this exact PR head; the bot never supplies that approval.'
            : 'The trusted audit permits the mechanical release update. Authored capability guidance and historical qualification notes are preserved; review the generated installation commands and evidence before merging.';
          writeFileSync(process.env.RUNNER_TEMP + '/docs-release-body.md',
            `Update the website for ${process.env.SELECTED_TAG}. The trusted main policy validates published release/tag/source identity, the inventory and asset digests, and extracts the bundled command reference without executing the CLI. Release-dependent installation blocks are generated in the canonical docs/.\n\n${review}\n\nRequired checks and applicable review must pass; the repository App then requests normal merge-queue entry for this exact head. Merging deploys through the github-pages environment and does not publish a CLI release.\n`);
          JS
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --title "docs: update website for $version" --body-file "$RUNNER_TEMP/docs-release-body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head codex/docs-release-update --title "docs: update website for $version" --body-file "$RUNNER_TEMP/docs-release-body.md"
          fi

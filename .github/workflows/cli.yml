name: CLI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Install pinned Postman CLI
        if: runner.os == 'Linux'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/postman" postman-cli@1.75.0
          echo "$RUNNER_TEMP/postman/bin" >> "$GITHUB_PATH"
      - name: Controlled public-contract simulation
        if: runner.os == 'Linux'
        run: sh scripts/test-capabilities.sh
      - name: Read-only package and release policy fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/release-policy-venv"
          "$RUNNER_TEMP/release-policy-venv/bin/pip" install jsonschema==4.26.0
          "$RUNNER_TEMP/release-policy-venv/bin/python" -m unittest discover -s tests/packaging -v
          npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.3.0
          GITSTORE_RELEASE_PLEASE_MODULE="$RUNNER_TEMP/release-please/node_modules/release-please" \
            "$RUNNER_TEMP/release-policy-venv/bin/python" -m unittest discover -s tests/release -v
  control-package:
    name: macOS control pair ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build matching production control pair for deployment floor
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          LIBZ_SYS_STATIC: '1'
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          cargo build --workspace --release --locked
          cmake -S daemon -B build/control -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DGITSTORED_TESTING=OFF
          cmake --build build/control --parallel 2
          install -d -m 700 build/control-pair
          install -m 755 target/release/gs build/control/gitstored build/control-pair/
          for binary in gs gitstored; do
            python3 runtime/packaging/closure.py --binary "$PWD/build/control-pair/$binary" > "build/control-pair/$binary.closure.json"
          done
      - name: Installed pair policy and unavailable-runtime checks
        run: |
          python3 -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/pip" install jsonschema==4.26.0
          GITSTORE_PACKAGE_PAIR="$PWD/build/control-pair" "$RUNNER_TEMP/package-venv/bin/python" -m unittest discover -s tests/packaging -v
          GITSTORED_TEST_BINARY="$PWD/build/control-pair/gitstored" cargo test --locked -p gs --test daemon_setup -- --include-ignored
      - name: Collect source and notice review inputs for this actual architecture
        run: |
          material_target=$(rustc --version --verbose | awk '/^host: / {print $2}')
          cargo metadata --locked --format-version 1 --filter-platform "$material_target" > "$RUNNER_TEMP/cli-material-metadata.json"
          "$RUNNER_TEMP/package-venv/bin/python" scripts/collect-rust-materials.py \
            --metadata "$RUNNER_TEMP/cli-material-metadata.json" --lockfile Cargo.lock --output "$RUNNER_TEMP/rust-material-review"
          "$RUNNER_TEMP/package-venv/bin/python" scripts/collect-native-materials.py \
            --rust-review "$RUNNER_TEMP/rust-material-review" --build-dir "$PWD/build/control" --output "$RUNNER_TEMP/material-review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-material-review-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/material-review/notices.json
            ${{ runner.temp }}/material-review/closure.json
            ${{ runner.temp }}/material-review/materials.json
            ${{ runner.temp }}/material-review/review.json
          if-no-files-found: error
          retention-days: 7
      - name: Build complete read-only candidate and exercise archive/npm
        run: |
          "$RUNNER_TEMP/package-venv/bin/python" scripts/build-release-platform.py --output "$RUNNER_TEMP/complete-candidate"
          "$RUNNER_TEMP/package-venv/bin/python" tests/packaging/check-produced.py \
            --candidate "$RUNNER_TEMP/complete-candidate" --output "$RUNNER_TEMP/produced-package-checks"
      - name: Check actual next-alpha replacement and native refusal controls
        run: |
          "$RUNNER_TEMP/package-venv/bin/python" tests/packaging/check-produced-replacement.py \
            --candidate "$RUNNER_TEMP/complete-candidate" --output "$RUNNER_TEMP/replacement-checks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unqualified-replacement-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/replacement-checks/result.json
            ${{ runner.temp }}/replacement-checks/built/UNQUALIFIED.json
            ${{ runner.temp }}/replacement-checks/packages/UNQUALIFIED*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unpublished-production-candidate-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/complete-candidate/assets/*
            ${{ runner.temp }}/produced-package-checks/measurement.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpublished-control-closure-${{ matrix.runner }}
          path: build/control-pair/*.closure.json
          if-no-files-found: error
          retention-days: 7

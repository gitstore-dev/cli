name: Release Please
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'gitstore-dev/cli' && vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Preserve trusted bootstrap updater
        id: policy
        run: |
          install -d "$RUNNER_TEMP/release-policy/scripts" "$RUNNER_TEMP/release-policy/runtime/packaging"
          cp scripts/remove-release-bootstrap.py scripts/check-release-version.py "$RUNNER_TEMP/release-policy/scripts/"
          cp runtime/packaging/versions.py "$RUNNER_TEMP/release-policy/runtime/packaging/"
          python3 -c 'import json; print("previous=" + json.load(open(".release-please-manifest.json"))["."])' >> "$GITHUB_OUTPUT"
      - name: Create repository-scoped release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; release-please 17.6.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select generated release proposal
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true
      - name: Remove one-time alpha.1 override in its proposal
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        env:
          PREVIOUS_VERSION: ${{ steps.policy.outputs.previous }}
        run: |
          python3 "$RUNNER_TEMP/release-policy/scripts/check-release-version.py" --root "$GITHUB_WORKSPACE" --previous "$PREVIOUS_VERSION"
          python3 "$RUNNER_TEMP/release-policy/scripts/remove-release-bootstrap.py" --root "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- release-please-config.json; then
            git config user.name 'gitstore-release-bot'
            git config user.email 'gitstore-release-bot@users.noreply.github.com'
            git add release-please-config.json
            git -c core.hooksPath=/dev/null commit -m 'chore: remove initial alpha release override'
            git -c core.hooksPath=/dev/null push
          fi
